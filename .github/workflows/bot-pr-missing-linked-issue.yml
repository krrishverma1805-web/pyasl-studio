name: PR Missing Linked Issue

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: bot-pr-missing-linked-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-linked-issue:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check PR for a linked issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUIRE_AUTHOR_ASSIGNED: "true"
        with:
          script: |
            const script = require('./.github/scripts/bot-pr-missing-linked-issue.js');
            await script({ github, context, core });
